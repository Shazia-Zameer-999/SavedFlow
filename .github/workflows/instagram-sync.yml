name: Instagram Saved Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      - name: Restore Instagram session
        env:
          INSTAGRAM_SESSION_STATE: ${{ secrets.INSTAGRAM_SESSION_STATE }}
        run: |
          echo "$INSTAGRAM_SESSION_STATE" | base64 --decode > instagram-state.json
        

      - name: Create scheduled sync job
        if: github.event_name == 'schedule'
        env:
          SAVEDFLOW_SERVER_URL: ${{ secrets.SAVEDFLOW_SERVER_URL }}
        run: |
          curl -f -X POST \
            "$SAVEDFLOW_SERVER_URL/api/instagram/sync/request"
      - name: Run Instagram sync
        env:
          SAVEDFLOW_SERVER_URL: ${{ secrets.SAVEDFLOW_SERVER_URL }}
          INSTAGRAM_SAVED_URL: ${{ secrets.INSTAGRAM_SAVED_URL }}
          SAVEDFLOW_SYNC_TOKEN: ${{ secrets.SAVEDFLOW_SYNC_TOKEN }}
        run: |
          python scripts/instagram_saved_sync.py \
            --profile ./github-instagram-profile \
            --once